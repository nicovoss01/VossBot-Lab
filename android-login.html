<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>VossFit · Google-Anmeldung</title>
<style>[hidden]{display:none!important}body{margin:0;background:#060d26;color:#effbff;font:17px system-ui;min-height:100vh;display:grid;place-items:center}main{max-width:380px;padding:28px;text-align:center}h1{color:#00d6ef}button,a{display:block;box-sizing:border-box;width:100%;padding:16px;border:0;border-radius:16px;background:#04cde8;color:#00283e;font:600 17px system-ui;text-decoration:none;margin:20px 0}button:disabled{opacity:.5}p{line-height:1.6}small{color:#9badc2}</style>
<main><h1>VossFit Vitality</h1><p id="status">Anmeldung wird vorbereitet …</p><button id="login" disabled>Mit Google anmelden</button><a id="back" hidden>Zurück zu VossFit</a><small>Die Anmeldung erfolgt bei Google. Anschließend kehrst du zur App zurück.</small></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,setPersistence,inMemoryPersistence,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
const status=document.getElementById('status'),button=document.getElementById('login'),back=document.getElementById('back');
const params=new URLSearchParams(location.hash.slice(1)),state=params.get('state'),keyText=params.get('key');
history.replaceState(null,'',location.pathname);
const valid=s=>typeof s==='string'&&/^[A-Za-z0-9_-]{43}$/.test(s);
const decode=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='),c=>c.charCodeAt(0));
const encode=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
if(!valid(state)||!valid(keyText)){status.textContent='Bitte starte die Anmeldung in der VossFit-App.';button.hidden=true;}
else {
 const auth=getAuth(initializeApp({apiKey:'AIzaSyC5NcHUMPawsIf8dZE4EUOrkZooqziCVKY',authDomain:'vossfit-vitality.firebaseapp.com',projectId:'vossfit-vitality',appId:'1:939253982636:web:e22370002c8eb9b2934609'}));
 try {
 await setPersistence(auth,inMemoryPersistence);
 const key=await crypto.subtle.importKey('raw',decode(keyText),'AES-GCM',false,['encrypt']);
 status.textContent='Wähle dein Google-Konto, um deine VossFit-Daten zu synchronisieren.';button.disabled=false;
 button.onclick=async()=>{
 button.disabled=true;status.textContent='Google-Anmeldung geöffnet …';
 try {
  const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});
  const result=await signInWithPopup(auth,provider);
  const credential=GoogleAuthProvider.credentialFromResult(result);
  if(!credential?.idToken)throw new Error('Google hat keinen Anmeldenachweis geliefert. Bitte erneut versuchen.');
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:new TextEncoder().encode(state)},key,new TextEncoder().encode(JSON.stringify({idToken:credential.idToken})));
  await signOut(auth);
  const target='vossfitvitality://auth?state='+state+'&iv='+encode(iv)+'&payload='+encode(encrypted);
  back.href=target;back.hidden=false;button.hidden=true;
  status.textContent='Angemeldet. Tippe auf „Zurück zu VossFit“, um die Anmeldung abzuschließen.';
 }catch(e){status.textContent=e.code==='auth/unauthorized-domain'?'Diese Website muss in Firebase Authentication unter autorisierten Domains freigeschaltet werden: nicovoss01.github.io.':('Anmeldung fehlgeschlagen: '+(e.code||e.message));button.disabled=false;}
 };
 }catch(e){status.textContent='Anmeldung konnte nicht vorbereitet werden. Bitte Internetverbindung prüfen und erneut in der App starten.';}
}
</script></html>
