name: Publish VossBot OS Preview
on:
  push:
    branches: [main]
    paths:
      - 'apps/lab-combined-preview/**'
      - '.github/workflows/deploy-vossbot-os.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vossbot-os-preview
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check preview assets
        run: test -f apps/lab-combined-preview/index.html
      - name: Deploy to isolated Pages preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare API token'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing Cloudflare account ID'; exit 1; }
          npx --yes wrangler@4 pages deploy apps/lab-combined-preview --project-name=vossbot-os-integration-preview --branch=main
