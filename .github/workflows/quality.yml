name: Sandbox quality checks

on:
  pull_request:
  push:
    branches: [main, develop, "feature/**", "sync/**"]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Secret-pattern scan (redacted)
        shell: pwsh
        run: ./scripts/scan-secrets.ps1 -TargetPath .
      - name: Check whitespace errors
        run: git diff --check
      - name: Check Lab inline JavaScript syntax
        run: node scripts/check-lab-js.cjs
